# 合并到 master 后构建当前应发布的版本，并创建 GitLab Release。
# 共享 Runner 只能构建 Linux 安装包。macOS 和 Windows 仍由 GitHub 上的 tag 发布。

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_COMMIT_MESSAGE =~ /\[skip ci\]|\[ci skip\]/
      when: never
    - if: $CI_COMMIT_BRANCH == "master"

stages:
  - release

release:
  stage: release
  image: ubuntu:22.04
  resource_group: master-release
  interruptible: false
  timeout: 2h
  variables:
    DEBIAN_FRONTEND: noninteractive
    GIT_DEPTH: "0"
    CARGO_HOME: "$CI_PROJECT_DIR/.cargo"
    RUSTUP_HOME: "$CI_PROJECT_DIR/.rustup"
    COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
  cache:
    key: master-release
    paths:
      - .cargo/registry
      - .cargo/git
      - node_modules
  script:
    - apt-get update
    - apt-get install -y curl ca-certificates git build-essential pkg-config libssl-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 rpm file
    - curl -fsSL https://deb.nodesource.com/setup_22.x | bash -
    - apt-get install -y nodejs
    - corepack enable
    - corepack prepare pnpm@10 --activate
    - curl --proto "=https" --tlsv1.2 -fsSL https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
    - . "$CARGO_HOME/env"
    - curl -fsSL --output /usr/local/bin/release-cli "https://gitlab.com/api/v4/projects/gitlab-org%2Frelease-cli/packages/generic/release-cli/latest/release-cli-linux-amd64"
    - chmod +x /usr/local/bin/release-cli
    - git fetch --tags --force origin
    - VERSION="$(node scripts/release-version.mjs)"
    - echo "Publishing $VERSION"
    - |
      set -euo pipefail
      RELEASE_REF="$CI_COMMIT_SHA"
      if ! git diff --quiet; then
        git config user.email "ci@gitlab.local"
        git config user.name "GitLab CI"
        git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
        git commit -m "chore: release v${VERSION} [skip ci]"
        if git push "https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git" HEAD:master; then
          RELEASE_REF="$(git rev-parse HEAD)"
        else
          echo "Version commit was not pushed. The release tag stays on this pipeline commit."
          RELEASE_REF="$CI_COMMIT_SHA"
        fi
      fi
      echo "RELEASE_REF=${RELEASE_REF}" > release-ref.env
    - pnpm install --frozen-lockfile
    - pnpm tauri build
    - |
      set -euo pipefail
      shopt -s nullglob
      files=(
        src-tauri/target/release/bundle/deb/*.deb
        src-tauri/target/release/bundle/appimage/*.AppImage
        src-tauri/target/release/bundle/rpm/*.rpm
      )
      if [ "${#files[@]}" -eq 0 ]; then
        echo "No Linux installers were produced"
        exit 1
      fi
      links=()
      for file in "${files[@]}"; do
        name="$(basename "$file")"
        echo "Uploading $name"
        curl --fail --show-error --header "JOB-TOKEN: ${CI_JOB_TOKEN}" --upload-file "$file" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/central-devops-kit/${VERSION}/${name}"
        url="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/central-devops-kit/${VERSION}/${name}"
        links+=(--assets-link "{\"name\":\"${name}\",\"url\":\"${url}\",\"link_type\":\"package\"}")
      done
      RELEASE_REF="$(sed -n 's/^RELEASE_REF=//p' release-ref.env)"
      release-cli create \
        --name "Central DevOps Kit v${VERSION}" \
        --tag-name "v${VERSION}" \
        --tag-message "v${VERSION}" \
        --ref "$RELEASE_REF" \
        --description "合并到 master 后自动构建的 Linux 安装包。" \
        "${links[@]}"
  artifacts:
    paths:
      - src-tauri/target/release/bundle/deb/*.deb
      - src-tauri/target/release/bundle/appimage/*.AppImage
      - src-tauri/target/release/bundle/rpm/*.rpm
    expire_in: 30 days
