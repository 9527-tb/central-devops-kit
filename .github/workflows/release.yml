name: Release

on:
  workflow_dispatch:
  push:
    branches:
      - master

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') && !contains(github.event.head_commit.message, '[ci skip]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.meta.outputs.version }}
      sha: ${{ steps.meta.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - id: meta
        run: |
          set -euo pipefail
          git fetch --tags --force
          version="$(node scripts/release-version.mjs)"
          sha="${GITHUB_SHA}"
          if ! git diff --quiet; then
            git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json
            git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "chore: release v${version} [skip ci]"
            git push origin HEAD:master
            sha="$(git rev-parse HEAD)"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "sha=${sha}" >> "$GITHUB_OUTPUT"
          echo "Publishing v${version} from ${sha}"

  release:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.prepare.outputs.sha }}

      - name: Check version files
        shell: bash
        run: |
          node --input-type=module <<'EOF'
          import { readFileSync } from "node:fs";
          const pkg = JSON.parse(readFileSync("package.json", "utf8")).version;
          const tauri = JSON.parse(readFileSync("src-tauri/tauri.conf.json", "utf8")).version;
          const cargo = readFileSync("src-tauri/Cargo.toml", "utf8").match(/^version = "([^"]+)"/m)?.[1];
          if (!pkg || pkg !== tauri || pkg !== cargo) {
            console.error(`Version mismatch: package.json=${pkg} tauri.conf.json=${tauri} Cargo.toml=${cargo}`);
            process.exit(1);
          }
          console.log(`App version ${pkg}`);
          EOF

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils libfuse2 rpm

      - uses: pnpm/action-setup@v6
        with:
          version: 10

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify updater signing key
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Missing secret TAURI_SIGNING_PRIVATE_KEY. Add the contents of ~/.tauri/central-devops-kit.key in repo Settings → Secrets."
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: Central DevOps Kit v__VERSION__
          releaseBody: |
            ## Central DevOps Kit v__VERSION__

            Asset names include the operating system: macOS, Windows, and Linux.
            The app updater reads latest.json from this release.
          releaseDraft: false
          prerelease: false
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

  fix-updater-json:
    needs: [prepare, release]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Rename release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/rename-release-assets.mjs "v${{ needs.prepare.outputs.version }}"

      - name: Rebuild latest.json from release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v${{ needs.prepare.outputs.version }}"
          echo "Rebuilding latest.json on $TAG"
          node scripts/rebuild-latest-json.mjs "$TAG"
          ok=0
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsSL "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/latest.json" || true)
            if [ -z "$body" ]; then
              echo "Release asset not ready (attempt $i), sleeping..."
              sleep 5
              continue
            fi
            if printf '%s' "$body" | grep -q 'api.github.com/repos/.*/releases/assets/'; then
              echo "Still has API URLs (attempt $i), sleeping..."
              sleep 5
              continue
            fi
            if ! printf '%s' "$body" | grep -q '"darwin-aarch64"'; then
              echo "Missing darwin-aarch64 (attempt $i), sleeping..."
              sleep 5
              continue
            fi
            ok=1
            break
          done
          if [ "$ok" != "1" ]; then
            echo "::error::latest.json invalid on the public release (API URLs or missing darwin)"
            exit 1
          fi
          echo "Verified latest.json with browser download URLs"

      - name: Publish updater manifest
        run: |
          set -euo pipefail
          git add updater/latest.json
          if git diff --cached --quiet; then
            echo "updater/latest.json unchanged"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update updater manifest [skip ci]"
          git push origin HEAD:master
